# Local development only. Production and staging run on Coolify with their own
# Postgres instances and env vars (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: climb
      POSTGRES_PASSWORD: climb
      POSTGRES_DB: climb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://climb:climb@db:5432/climb
      AUTH_SECRET: local-development-secret-change-me
      APP_URL: http://localhost:3000
      S3_PREFIX: dev/
      MAIL_TRANSPORT: console
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: changeme123
    ports:
      - "3000:3000"

volumes:
  db-data:
